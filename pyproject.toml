[project]
name = "thesis"
version = "0.1.0"
description = "Protecting User Privacy in Long-Term AI Chats: Defender model + browser extension"
requires-python = ">=3.11,<3.13"
readme = "README.md"

dependencies = [
    # Core ML
    "torch>=2.4,<3.0",
    "transformers>=4.45",
    "datasets>=3.0",
    "accelerate>=0.34",
    "peft>=0.13",
    "trl>=0.11",
    "sentence-transformers>=3.0",

    # Evaluation and baselines (Phase 4)
    "scikit-learn>=1.5",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",

    # Data + utilities
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "omegaconf>=2.3",
    "python-dotenv>=1.0",
    "tqdm>=4.66",

    # Experiment tracking
    "wandb>=0.18",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line too long — ruff-format handles this
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
