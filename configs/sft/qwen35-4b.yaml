# SFT warm-up for the Defender — Qwen3.5-4B (D-014), corpus from D-022.
# This file is MERGED on top of configs/base.yaml by the training script,
# so it inherits seed / paths / tracking and only adds what SFT needs.

run_name: sft-qwen35-4b

defender:
  # Confirm the exact HF repo id once on the cluster. Fallback if the hybrid
  # Gated-DeltaNet arch has TRL/PEFT quirks (D-014): Qwen/Qwen3-4B-Instruct-2507
  base_model: Qwen/Qwen3.5-4B-Instruct
  tier: "4b"

sft:
  # --- data ---
  train_file: ${paths.data_dir}/sft/train.jsonl
  val_file: ${paths.data_dir}/sft/val.jsonl
  # Provenance string logged with the run for reproducibility (docs/reproducibility.md).
  dataset_version: "sft-synth-gemini35flash-v1-clean1528"
  max_seq_len: 2048           # > longest (system+user+assistant); see smoke-test note
  packing: false              # keep one example per sequence so masking is exact
  assistant_only_loss: true   # train ONLY on the rewrite tokens, not system/user

  # --- LoRA (parameter-efficient; full FT is overkill for a 4B warm-up) ---
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  # --- optimization ---
  epochs: 3
  lr: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  per_device_batch_size: 8
  grad_accum: 2               # effective batch = 8 * 2 * num_gpus
  bf16: true                  # H100/H200 native; do NOT use fp16 here
  gradient_checkpointing: true
  max_grad_norm: 1.0

  # --- eval / logging / checkpoints ---
  eval_strategy: steps
  eval_steps: 50
  logging_steps: 10
  save_steps: 50
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
